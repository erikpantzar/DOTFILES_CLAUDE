# Prefix: default Ctrl-b

# Vim-style pane navigation and copy mode
setw -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Start numbering at 1, easier to reach than 0
set -g base-index 1
set -g pane-base-index 1

# Mouse support: click panes, resize, scroll
set -g mouse on

# Status bar at the bottom
set -g status-position bottom

# Bigger scrollback
set -g history-limit 10000

# Keep manual window names (Ctrl-b ,) instead of auto-renaming to running command
setw -g automatic-rename off

# Faster key repeat
set -g repeat-time 500

# 256 colors + true color
set -g default-terminal "screen-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# ---- fzf-powered jumpers ----
# prefix + f: fuzzy-find and switch session
bind f run-shell "tmux list-sessions -F '#S' | fzf --reverse --height=40% | xargs -I{} tmux switch-client -t {}"
# prefix + w: fuzzy-find and jump to window across all sessions
bind w run-shell "tmux list-windows -a -F '#S:#I: #W' | fzf --reverse --height=40% | cut -d: -f1,2 | xargs -I{} tmux switch-client -t {}"

# ---- Quality-of-life extras ----
# prefix + r: reload config without restarting tmux
bind r source-file ~/.tmux.conf \; display-message "config reloaded"
# prefix + | and -: intuitive split bindings
bind | split-window -h
bind - split-window -v


# ---- Plugins (managed by TPM) ----
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# resurrect: also restore pane contents (scrollback) and vim sessions
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'

# continuum: autosave every 15 min + restore last session on tmux start
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Catppuccin theme: mocha (dark) or latte (light), picked from macOS appearance.
# AppleInterfaceStyle only exists in dark mode, so the read fails in light mode.
# Options must be set BEFORE catppuccin.tmux runs, since it reads them once —
# after flipping the OS theme, reload with prefix+r to re-pick.
if-shell "defaults read -g AppleInterfaceStyle 2>/dev/null | grep -q Dark" \
  'set -g @catppuccin_flavor "mocha"' \
  'set -g @catppuccin_flavor "latte"'
# "none" turns off catppuccin's colored chip per window tab; we draw our own
# flat, minimal format below instead (set after catppuccin.tmux runs).
set -g @catppuccin_window_status_style "none"

# No solid fill across the whole bar - session/directory/time stay as their
# own small colored pills floating on the terminal background instead.
set -g @catppuccin_status_background "none"

# catppuccin/tmux is loaded manually (not via @plugin) because its repo
# basename "tmux" collides with tmux-plugins/tmux, so TPM silently refuses to
# clone it under that name (confirmed by catppuccin's own README).
run ~/.tmux/plugins/catppuccin/catppuccin.tmux

# tmux-agent-indicator: same manual-load story as catppuccin above - it was
# installed by its own installer (a plain directory, not a git clone TPM can
# manage), not via @plugin. Colors pane borders/window titles and adds
# #{agent_indicator} to the status bar when Claude/Codex is running, needs
# input, or is done. Installed 2026-09-15; its Claude hooks were appended
# to ~/.claude/settings.json (Stop/UserPromptSubmit/PermissionRequest).
run-shell '~/.tmux/plugins/tmux-agent-indicator/agent-indicator.tmux'

# Animated status-bar icon while an agent is actively running (Knight Rider
# style, self-refreshing - not tied to status-interval). Ships with the
# plugin but defaults off; the setup wizard left it off, so "running" only
# showed as a static quiet border with no motion. Turning it on so there's a
# visible sign of activity, not just a color that appears once it's done.
set -g @agent-indicator-animation-enabled 'on'

# Colors below are the wizard's own "subtle" preset, remapped onto our
# catppuccin palette instead of raw ANSI numbers. No pane background wash
# for any state - just a quiet border + tab color, so it doesn't fight with
# the rest of the bar. Re-running setup.sh will replace this block cleanly.
# BEGIN tmux-agent-indicator-colors
set -g @agent-indicator-running-bg ''
set -g @agent-indicator-running-border '#{@thm_overlay_1}'
set -g @agent-indicator-running-window-title-bg ''
set -g @agent-indicator-running-window-title-fg ''
set -g @agent-indicator-needs-input-bg ''
set -g @agent-indicator-needs-input-border '#{@thm_yellow}'
set -g @agent-indicator-needs-input-window-title-bg '#{@thm_yellow}'
set -g @agent-indicator-needs-input-window-title-fg '#{@thm_crust}'
set -g @agent-indicator-done-bg ''
set -g @agent-indicator-done-border '#{@thm_green}'
set -g @agent-indicator-done-window-title-bg '#{@thm_green}'
set -g @agent-indicator-done-window-title-fg '#{@thm_crust}'
# END tmux-agent-indicator-colors

# Window tabs: flat text, no background chip - dim when inactive, lavender
# + bold for the active one, so it's still obvious which tab you're on.
# Show the pane title (#T) instead of the window name (#W): Claude Code sets
# #T live via OSC to the current task ("✳ ..."), but #W is frozen at
# creation-time since automatic-rename is off - so #W always just says "zsh".
# Falls back to #W when a pane hasn't set a title (plain shells).
set -g window-status-format "#[fg=#{@thm_overlay_1}] #I:#{?pane_title,#{=/24:pane_title},#W} "
set -g window-status-current-format "#[fg=#{@thm_lavender},bold] #I:#{?pane_title,#{=/24:pane_title},#W} "
set -g window-status-separator ""

# Status bar: session name on the left, directory + time + agent status +
# prefix highlight on the right (no battery per request - always on charge).
set -g status-left-length 40
set -g status-left "#{E:@catppuccin_status_session}"

set -g @catppuccin_date_time_text " %H:%M"

set -g status-right-length 100
set -g status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_date_time}"
set -ag status-right " #{agent_indicator}"
set -ag status-right "#{prefix_highlight}"

# Prefix highlight: flash when prefix key is active
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_copy_mode_attr 'fg=black,bg=green,bold'

# Blank line above the bar for breathing room. status-format[1] is tmux's
# built-in default single-line template pinned here verbatim so our styling
# still renders on it - if it looks broken after a tmux upgrade, regenerate
# with `tmux show-options -g status-format[0]` and swap the value in.
set -g status 2
set -g status-format[0] ""
set -g status-format[1] "#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{E:window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{E:window-status-separator}}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]"

# Initialize TPM (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
