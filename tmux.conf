# Mouse support — click to select panes, drag to resize, wheel to scroll
set -g mouse on

# vi-style navigation once inside copy mode (doesn't touch the prefix or any other bindings)
setw -g mode-keys vi

# Bigger scrollback buffer
set -g history-limit 50000

# True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Plugins (managed by TPM — prefix + I to install/update)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux'

# Auto-restore last session on tmux start
set -g @continuum-restore 'on'

# Keep TPM's init line at the very bottom
run '~/.tmux/plugins/tpm/tpm'
